name: refERence Data Pipeline

on:
  schedule:
    - cron: '0 */9 * * *' # 9시간마다 실행
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Python 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존성 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: 데이터 파이프라인 스크립트 실행
      env:
        BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
      run: python run_pipeline.py

    - name: 변경된 데이터 자동 커밋 및 푸시
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add reference_dataset.csv snowball_pending_add.txt snowball_processed.txt top_reference_routes.csv
        
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 수집 데이터 및 최적 루트 갱신" && git pull --rebase origin main && git push)
