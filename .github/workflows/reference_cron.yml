name: refERence Data Pipeline (Manual)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Python 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 의존성 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: 🚀 refERence 파이프라인 실행
      env:
        BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
      run: python run_pipeline.py

    - name: 💾 변경된 데이터 자동 커밋 & 푸시
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        for file in reference_dataset.csv snowball_pending_add.txt snowball_processed.txt top_reference_routes.csv er_master_mapping.csv; do
          if [ -f "$file" ]; then git add "$file"; fi
        done
        
        if git diff --cached --quiet; then
          echo "변경사항이 없습니다."
          exit 0
        fi
        
        git commit -m "🤖 [자동] refERence 대규모 수집 데이터 갱신"
        git fetch origin main
        git pull --rebase origin main
        git push origin main
