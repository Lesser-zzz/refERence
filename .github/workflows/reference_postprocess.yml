name: refERence Post-Process (Guide Data)

on:
  workflow_dispatch: # 오직 버튼을 눌렀을 때만 실행

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 의존성 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: 📝 가이드 상세 데이터(스킬/대체템) 추출
      env:
        BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
      run: python postprocess_guide.py

    - name: 💾 추출 결과물 깃허브에 자동 저장
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        # 💡 새롭게 생성된 가이드 초안 파일을 staging 목록에 추가
        git add reference_guide_output.txt || true
        
        if git diff --cached --quiet; then
          echo "변경사항이 없습니다."
          exit 0
        fi
        
        git commit -m "🤖 [자동] refERence 상세 가이드 텍스트 추출 완료"
        git fetch origin main
        git pull --rebase origin main
        git push origin main
