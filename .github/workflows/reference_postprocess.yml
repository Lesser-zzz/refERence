name: refERence Post-Process (Guide Data)

on:
  workflow_dispatch: # 오직 버튼을 눌렀을 때만 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 의존성 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: 📝 가이드 상세 데이터(스킬/대체템) 추출
      env:
        BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
      run: python postprocess_guide.py
